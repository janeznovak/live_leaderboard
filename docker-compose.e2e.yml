services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
  github:
    image: node:25-bookworm-slim
    working_dir: /app
    volumes: [".:/app"]
    command: node scripts/github-oauth-stub.mjs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
      REDIS_URL: redis://redis:6379
      SEED_ADMIN_PASSWORD: e2e-admin-password
      NUXT_DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
      NUXT_REDIS_URL: redis://redis:6379
      NUXT_GITHUB_CLIENT_ID: e2e-client
      NUXT_GITHUB_CLIENT_SECRET: e2e-secret
      NUXT_GITHUB_OAUTH_BASE_URL: http://github:4000
      NUXT_GITHUB_API_BASE_URL: http://github:4000
      NUXT_GITHUB_REDIRECT_URL: http://leaderboard.test:3000/api/auth/github/callback
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    command: sh -c 'node scripts/migrate.mjs && node scripts/seed.mjs && node .output/server/index.mjs'
    ports: ["${APP_PORT:-3000}:3000"]
    networks:
      default:
        aliases: [leaderboard.test]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/games').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      github: { condition: service_healthy }
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    volumes: [".:/app", "e2e_node_modules:/app/node_modules"]
    environment:
      BASE_URL: http://leaderboard.test:3000
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
      REDIS_URL: redis://redis:6379
      PLAYWRIGHT_WORKERS: 1
    command: sh -c 'npm ci && npx playwright test'
    depends_on:
      app: { condition: service_healthy }
volumes:
  e2e_node_modules:
